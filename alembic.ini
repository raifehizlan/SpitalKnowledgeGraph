[alembic]
script_location = alembic
prepend_sys_path = src
sqlalchemy.url = postgresql+psycopg://shi:shi@localhost:5432/shi

[loggers]
keys = root
level = WARN

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
