[project]
name = "swiss-hospital-intelligence"
version = "0.1.0"
description = "Evidence-based institutional intelligence for Swiss hospitals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "owlready2>=0.46",
    "pyshacl>=0.26",
    "rdflib>=7.0",
    "streamlit>=1.40",
    "pymupdf>=1.24",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
